[package]
name = "rust-boilerplate"
version = "0.1.0"
edition = "2024"
[dependencies]
axum = { version = "0.8.9" }
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = [
    "with-serde_json-1",
    "with-time-0_3",
    "with-uuid-1",
] }
postgres-types = { version = "0.2", features = [
    "derive"
] }
cornucopia = { path = "./src/db" }
refinery = { version = "0.8", features = [
    "tokio-postgres"
] }

serde = { version = "1", features = [
    "derive"
] }
serde_json = "1"
uuid = { version = "1", features = [
    "serde",
    "v4"
] }
dotenv = "0.15"